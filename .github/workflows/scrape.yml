name: 1TamilMV Auto-Scraper (720p & 1080p Only)

on:
  schedule:
    # Best-effort fallback only. The reliable 30-minute cadence comes from the
    # Koyeb app calling workflow_dispatch (GITHUB_DISPATCH_* env vars).
    - cron: '*/30 * * * *'
  workflow_dispatch: # manual trigger (UI button) AND the external cron target

permissions:
  contents: write

# Never run two scrapers at once (a scrape takes ~8-10 min).
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # a hung scrape can't burn Actions minutes

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🚀 Run 1TamilMV Scraper (720p & 1080p Filter)
        run: node src/scrape-cli.js
        env:
          MAX_SCRAPE_LIMIT: 300

      - name: 💾 Commit and Push Updated movies.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated 1TamilMV scrape update (720p & 1080p only) [skip ci]"
          file_pattern: "data/movies.json data/stats.json"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions <actions@github.com>"
